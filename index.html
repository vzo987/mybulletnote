<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VZO's 子彈筆記 Bullet Journal</title>
<style>
  :root {
    --paper: #faf6ef;
    --paper-card: #ffffff;
    --ink: #2c2a26;
    --ink-soft: #6b6357;
    --line: #e5ddd0;
    --accent: #b3541e;
    --accent-soft: #f3e3d3;
    --done: #8a9a5b;
    --shadow: 0 1px 3px rgba(60,50,30,.08), 0 4px 14px rgba(60,50,30,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    min-height: 100vh;
  }
  header {
    background: var(--paper-card);
    border-bottom: 2px solid var(--line);
    padding: 14px 24px 0;
    position: sticky; top: 0; z-index: 20;
  }
  .head-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; letter-spacing: .05em; }
  h1 .sub { font-size: .75rem; color: var(--ink-soft); font-weight: normal; margin-left: 8px; }
  .head-tools { margin-left: auto; display: flex; gap: 8px; }
  nav { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  nav button {
    background: none; border: none; cursor: pointer;
    font: inherit; font-size: .95rem; color: var(--ink-soft);
    padding: 8px 14px; border-bottom: 3px solid transparent;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  nav button:hover { color: var(--accent); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }

  .card {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 1.05rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card h2 .hint { font-size: .78rem; color: var(--ink-soft); font-weight: normal; }

  .btn {
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: inherit; font-size: .85rem; color: var(--ink);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .btn.small { padding: 3px 8px; font-size: .78rem; }

  .navbar-date { display: flex; align-items: center; gap: 8px; }
  input[type="date"], input[type="month"], select, input[type="text"] {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: #fffdf9; color: var(--ink);
  }
  input[type="text"] { flex: 1 1 150px; min-width: 0; }
  .quick-add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .navbar-date { flex-wrap: wrap; }

  ul.entries { list-style: none; }
  ul.entries li {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    padding: 7px 6px; border-bottom: 1px dashed var(--line);
  }
  ul.entries li:last-child { border-bottom: none; }
  .sym {
    width: 22px; text-align: center; font-weight: bold; cursor: pointer;
    font-family: Consolas, monospace; font-size: 1rem; flex-shrink: 0; margin-top: 1px;
    user-select: none;
  }
  .sym.task { color: var(--ink); }
  .sym.done { color: var(--done); }
  .sym.migrated, .sym.scheduled { color: var(--ink-soft); }
  .sym.event { color: var(--accent); }
  .sym.note { color: var(--ink-soft); }
  .etext { flex: 1 1 160px; line-height: 1.5; word-break: break-word; }
  .etext.done, .etext.migrated, .etext.scheduled { color: var(--ink-soft); }
  .etext.cancelled { text-decoration: line-through; color: #b0a89f; }
  .etext input { width: 100%; }
  .eloc { font-size: .72rem; color: var(--ink-soft); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .eacts { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; flex-shrink: 0; margin-left: auto; flex-wrap: wrap; }
  ul.entries li:hover .eacts { opacity: 1; }
  .eacts button {
    background: none; border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
    font-size: .72rem; padding: 2px 6px; color: var(--ink-soft);
  }
  .eacts button:hover { border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--ink-soft); font-size: .88rem; padding: 10px 4px; font-style: italic; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

  .mo-day { display: flex; gap: 10px; padding: 4px 2px; border-bottom: 1px solid #f2ece0; font-size: .88rem; }
  .mo-day .dnum { width: 52px; color: var(--ink-soft); flex-shrink: 0; font-family: Consolas, monospace; cursor: pointer; }
  .mo-day .dnum:hover { color: var(--accent); }
  .mo-day.today { background: var(--accent-soft); border-radius: 4px; }
  .mo-day .dents { flex: 1; }
  .mo-day .dent { display: flex; gap: 6px; }
  .mo-day .dent .sym { width: 14px; font-size: .85rem; }

  .future-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; background: none; padding: 6px 14px; cursor: pointer; font: inherit; font-size: .85rem; color: var(--ink-soft); }
  .seg button.active { background: var(--accent); color: #fff; }

  .hgrid { border-collapse: collapse; font-size: .82rem; display: block; overflow: auto; max-height: 560px; max-width: 100%; }
  .hgrid th, .hgrid td { border: 1px solid var(--line); padding: 4px 8px; text-align: center; white-space: nowrap; }
  .hgrid thead th { background: var(--accent-soft); position: sticky; top: 0; z-index: 2; }
  .hgrid td.hcell { cursor: pointer; min-width: 34px; }
  .hgrid td.hcell.on { background: var(--done); color: #fff; font-weight: bold; }
  .hgrid td.hcell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hgrid .todaycol { background: #fdf3e7; }
  .hgrid td.hcell.on.todaycol { background: var(--done); }
  .hgrid th.hname { text-align: left; position: sticky; left: 0; background: var(--accent-soft); z-index: 1; }
  .hgrid thead th.corner { position: sticky; left: 0; top: 0; z-index: 3; }
  .hgrid td.sumcol { font-weight: bold; background: #f7f2e8; }

  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat-card { background: #fffdf9; border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-card .num { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
  .stat-card .lbl { font-size: .78rem; color: var(--ink-soft); margin-top: 2px; }
  .stat-table { border-collapse: collapse; font-size: .85rem; width: 100%; }
  .stat-table th, .stat-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
  .stat-table th { background: var(--accent-soft); }
  .stat-table td.l { text-align: left; }
  .stat-table tr.total td { font-weight: bold; background: #f7f2e8; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .82rem; color: var(--ink-soft); margin-top: 8px; }
  .legend span b { font-family: Consolas, monospace; color: var(--ink); margin-right: 4px; }

  .mig-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fffdf9; }
  .mig-card .qtext { font-size: 1rem; margin-bottom: 6px; }
  .mig-card .qsrc { font-size: .78rem; color: var(--ink-soft); margin-bottom: 10px; }
  .mig-card .qbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .soul { background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; font-size: .88rem; margin-bottom: 16px; line-height: 1.7; }

  .index-list { list-style: none; }
  .index-list li { padding: 6px 4px; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  .index-list a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .index-list a:hover { text-decoration: underline; }
  .index-list .cnt { color: var(--ink-soft); font-size: .8rem; }

  .selbox { width: 15px; height: 15px; margin-top: 4px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
  .selph { width: 15px; flex-shrink: 0; }
  .selbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--paper-card); border-top: 2px solid var(--accent);
    padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    box-shadow: 0 -2px 12px rgba(60,50,30,.15); font-size: .9rem;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 8px;
    font-size: .88rem; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: .95; }

  dialog {
    border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px;
    box-shadow: var(--shadow); max-width: 420px; background: var(--paper-card); color: var(--ink);
  }
  dialog::backdrop { background: rgba(40,30,20,.35); }
  dialog h3 { margin-bottom: 12px; font-size: 1rem; }
  dialog .drow { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>✒ VZO's 子彈筆記<span class="sub">追蹤過去・整理現在・規劃未來</span></h1>
    <div class="head-tools">
      <span id="syncPill" class="btn small" style="cursor:pointer;color:var(--ink-soft)" onclick="openSyncDlg()" title="雲端同步設定">☁ 未同步</span>
      <button class="btn small" onclick="exportData()">匯出備份</button>
      <button class="btn small" onclick="document.getElementById('importFile').click()">匯入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>
  </div>
  <nav id="nav">
    <button data-view="daily">日誌</button>
    <button data-view="monthly">月誌</button>
    <button data-view="future">未來誌</button>
    <button data-view="habits">習慣追蹤</button>
    <button data-view="collections">群組</button>
    <button data-view="stats">統計</button>
    <button data-view="index">索引</button>
    <button data-view="migrate">月末轉移</button>
  </nav>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>

<div id="selbar" class="selbar" style="display:none">
  <b>☑ 已勾選 <span id="selcnt">0</span> 個任務</b>
  <button class="btn primary" onclick="selMigrate()">&gt; 一起轉移…</button>
  <button class="btn" onclick="clearSel()">取消勾選</button>
</div>

<dialog id="scheduleDlg">
  <h3>排程到未來誌 &lt;</h3>
  <p style="font-size:.85rem;color:var(--ink-soft)">這個任務重要、但近期還不需要做。選擇它所屬的未來月份：</p>
  <div style="margin-top:10px"><select id="scheduleMonth" style="width:100%"></select></div>
  <div class="drow">
    <button class="btn" onclick="document.getElementById('scheduleDlg').close()">取消</button>
    <button class="btn primary" onclick="confirmSchedule()">排程</button>
  </div>
</dialog>

<dialog id="migrateDlg" style="max-width:460px;width:calc(100vw - 40px)">
  <h3>轉移任務 &gt;</h3>
  <p id="mig-text" style="font-size:.88rem;background:var(--accent-soft);border-radius:6px;padding:8px 12px;word-break:break-word"></p>
  <p style="font-size:.78rem;color:var(--ink-soft);margin-top:6px">原任務會標記為已轉移（&gt;）留在原地，並在目標位置建立一份新任務。</p>
  <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
    <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap">
      <input type="radio" name="migTarget" value="daily" checked>某一天的日誌
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <button class="btn small" type="button" onclick="setMigDate(addDays(todayStr(),1))">明天</button>
        <button class="btn small" type="button" onclick="setMigDate(nextMonday())">下週一</button>
        <input type="date" id="mig-date" onfocus="pickMigTarget('daily')">
      </span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap">
      <input type="radio" name="migTarget" value="monthly">某個月的月誌
      <input type="month" id="mig-month" onfocus="pickMigTarget('monthly')" style="margin-left:auto">
    </label>
    <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap">
      <input type="radio" name="migTarget" value="future">未來誌（長期計畫）
      <select id="mig-future" onfocus="pickMigTarget('future')" style="margin-left:auto"></select>
    </label>
  </div>
  <div class="drow">
    <button class="btn" onclick="document.getElementById('migrateDlg').close()">取消</button>
    <button class="btn primary" onclick="confirmMigrate()">轉移</button>
  </div>
</dialog>

<dialog id="syncDlg" style="max-width:560px">
  <h3>☁ 雲端同步設定</h3>
  <p style="font-size:.82rem;color:var(--ink-soft);line-height:1.6">
    設定後，你在任何裝置（電腦、手機）的變動都會自動同步。需先建立一個免費的
    <b>Firebase Realtime Database</b> 專案，把設定值貼到下方。
    <a href="https://console.firebase.google.com/" target="_blank" style="color:var(--accent)">開啟 Firebase 主控台 ↗</a>
  </p>
  <div id="sync-state-line" style="font-size:.82rem;margin:8px 0;padding:6px 10px;border-radius:6px;background:var(--accent-soft)"></div>
  <label style="font-size:.82rem;font-weight:600">1. Firebase 設定值（整段貼上即可）</label>
  <textarea id="sync-config" rows="7" placeholder='貼上 Firebase 網頁應用程式的設定，例如：
const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "my-app.firebaseapp.com",
  databaseURL: "https://my-app-default-rtdb.firebaseio.com",
  projectId: "my-app",
  ...
};'
    style="width:100%;font-family:Consolas,monospace;font-size:.78rem;margin:6px 0 12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fffdf9;color:var(--ink)"></textarea>
  <label style="font-size:.82rem;font-weight:600">2. 筆記本代號（等同密碼，各裝置要填一樣的）</label>
  <div style="display:flex;gap:8px;margin:6px 0 4px">
    <input type="text" id="sync-notebook" placeholder="例：nb-a8k3f9x2..." style="flex:1">
    <button class="btn small" onclick="genNotebookId()">產生</button>
  </div>
  <p style="font-size:.75rem;color:var(--ink-soft)">⚠ 請設一段別人猜不到的字串並妥善保管；知道這串代號的人就能存取你的資料。</p>
  <div class="drow" style="justify-content:space-between">
    <button class="btn" onclick="disconnectSync();document.getElementById('syncDlg').close()" style="color:#c0392b">停止同步</button>
    <span>
      <button class="btn" onclick="document.getElementById('syncDlg').close()">關閉</button>
      <button class="btn primary" onclick="connectSync()">連線並同步</button>
    </span>
  </div>
</dialog>

<script>
/* ---------- 資料層 ---------- */
const STORE_KEY = 'bujo_data_v1';
let state = load();
function load() {
  let s = null;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) s = JSON.parse(raw);
  } catch (e) { console.error(e); }
  return normalize(s || {});
}
function normalize(s) {
  if (!Array.isArray(s.entries)) s.entries = [];
  if (!Array.isArray(s.collections)) s.collections = [];
  if (!Array.isArray(s.habits)) s.habits = [];
  if (!s.habitLogs) s.habitLogs = {};
  // 舊版群組中的習慣追蹤表 → 搬移到新的「習慣追蹤」
  const oldHabits = s.collections.filter(c => c.kind === 'habit');
  if (oldHabits.length) {
    oldHabits.forEach(c => {
      (c.habits || []).forEach(name => {
        const id = uid();
        s.habits.push({ id, name, kind: 'check', unit: '' });
        Object.keys(c.checks || {}).forEach(k => {
          if (k.startsWith(name + '|')) s.habitLogs[id + '|' + k.slice(name.length + 1)] = true;
        });
      });
    });
    s.collections = s.collections.filter(c => c.kind !== 'habit');
  }
  return s;
}
function saveLocal() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function save() {
  saveLocal();
  if (dbRef && !applyingRemote) pushToCloud();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- 雲端同步（Firebase Realtime Database） ---------- */
const SYNC_KEY = 'bujo_sync_v1';
const CLIENT_ID = (function () {
  let id = localStorage.getItem('bujo_client_id');
  if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bujo_client_id', id); }
  return id;
})();
let syncCfg = (function () {
  try { const r = localStorage.getItem(SYNC_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
})();
let dbRef = null;
let applyingRemote = false;
let pushTimer = null;

function saveSyncCfg(c) { if (c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }
function setSyncStatus(s, msg) {
  const pill = document.getElementById('syncPill');
  if (!pill) return;
  const map = { off: ['☁ 未同步', 'var(--ink-soft)'], connecting: ['⟳ 連線中…', 'var(--accent)'],
    on: ['☁ 已同步', 'var(--done)'], error: ['⚠ 同步錯誤', '#c0392b'] };
  const [txt, color] = map[s] || map.off;
  pill.textContent = msg || txt;
  pill.style.color = color;
  pill.style.borderColor = color;
}
function loadFirebaseSdk() {
  if (typeof firebase !== 'undefined' && firebase.database) return Promise.resolve();
  const urls = [
    'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js',
    'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js'
  ];
  return urls.reduce((p, url) => p.then(() => new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = url;
    sc.onload = res;
    sc.onerror = () => rej(new Error('無法載入 Firebase（請確認有網路連線）'));
    document.head.appendChild(sc);
  })), Promise.resolve());
}
function initSync() {
  if (!syncCfg) { setSyncStatus('off'); return; }
  setSyncStatus('connecting');
  loadFirebaseSdk().then(() => {
    try { if (!firebase.apps.length) firebase.initializeApp(syncCfg.config); } catch (e) {}
    dbRef = firebase.database().ref('notebooks/' + syncCfg.notebookId);
    dbRef.on('value', snap => {
      const remote = snap.val();
      if (!remote) { pushToCloud(true); setSyncStatus('on'); return; } // 雲端是空的 → 用本機資料建立
      if (remote.updatedBy === CLIENT_ID) { setSyncStatus('on'); return; } // 自己剛寫入的回音
      if ((remote.updatedAt || 0) < (state.updatedAt || 0)) { pushToCloud(true); return; } // 本機較新
      applyingRemote = true;
      state = normalize(remote);
      saveLocal();
      const ae = document.activeElement;
      if (!ae || (ae.tagName !== 'INPUT' && ae.tagName !== 'TEXTAREA')) render();
      applyingRemote = false;
      setSyncStatus('on');
      toast('已從雲端更新資料');
    }, err => setSyncStatus('error', '⚠ ' + (err.code || '連線失敗')));
    setSyncStatus('on');
  }).catch(e => { setSyncStatus('error'); toast(e.message); });
}
function pushToCloud(immediate) {
  if (!dbRef) return;
  clearTimeout(pushTimer);
  const doPush = () => {
    state.updatedAt = Date.now();
    state.updatedBy = CLIENT_ID;
    saveLocal();
    setSyncStatus('connecting');
    dbRef.set(state)
      .then(() => setSyncStatus('on'))
      .catch(() => setSyncStatus('error', '⚠ 寫入失敗'));
  };
  if (immediate) doPush(); else pushTimer = setTimeout(doPush, 800);
}
function openSyncDlg() {
  document.getElementById('sync-config').value = syncCfg ? cfgToText(syncCfg.config) : '';
  document.getElementById('sync-notebook').value = syncCfg ? syncCfg.notebookId : '';
  const line = document.getElementById('sync-state-line');
  line.textContent = syncCfg ? '目前狀態：已設定同步。此裝置代號 ' + CLIENT_ID.slice(0, 6) + '…' : '目前狀態：尚未設定，資料只存在這台裝置的瀏覽器。';
  document.getElementById('syncDlg').showModal();
}
function cfgToText(c) { return 'const firebaseConfig = ' + JSON.stringify(c, null, 2) + ';'; }
function genNotebookId() {
  document.getElementById('sync-notebook').value = 'nb-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
function parseFirebaseConfig(text) {
  const cfg = {};
  const re = /(\w+)\s*:\s*["']([^"']+)["']/g;
  let m;
  while ((m = re.exec(text))) cfg[m[1]] = m[2];
  return cfg;
}
function connectSync() {
  const text = document.getElementById('sync-config').value.trim();
  let nb = document.getElementById('sync-notebook').value.trim();
  const cfg = parseFirebaseConfig(text);
  if (!cfg.apiKey || !cfg.projectId) {
    alert('設定值看起來不完整：至少需要 apiKey 與 projectId。請把 Firebase 網頁應用程式的整段設定貼上。');
    return;
  }
  if (!cfg.databaseURL) cfg.databaseURL = 'https://' + cfg.projectId + '-default-rtdb.firebaseio.com';
  if (!nb) nb = 'nb-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
  syncCfg = { config: cfg, notebookId: nb };
  saveSyncCfg(syncCfg);
  document.getElementById('syncDlg').close();
  toast('設定完成，重新載入以套用同步…');
  setTimeout(() => location.reload(), 600);
}
function disconnectSync() {
  if (dbRef) { dbRef.off(); dbRef = null; }
  syncCfg = null;
  saveSyncCfg(null);
  setSyncStatus('off');
  toast('已停止同步（本機資料保留）');
}

/* ---------- 日期工具 ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function thisMonth() { return todayStr().slice(0, 7); }
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function addMonths(monthStr, n) {
  const [y, m] = monthStr.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;
}
function daysInMonth(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
const WEEK = ['日','一','二','三','四','五','六'];
function weekdayOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return WEEK[new Date(y, m - 1, d).getDay()];
}
function fmtMonth(monthStr) { const [y, m] = monthStr.split('-'); return `${y} 年 ${Number(m)} 月`; }
function fmtDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  return `${y} 年 ${Number(m)} 月 ${Number(d)} 日（${weekdayOf(dateStr)}）`;
}

/* ---------- 符號 ---------- */
function symbolOf(e) {
  if (e.type === 'event') return { ch: '○', cls: 'event', tip: '事件' };
  if (e.type === 'note') return { ch: '–', cls: 'note', tip: '筆記' };
  switch (e.status) {
    case 'done': return { ch: '✕', cls: 'done', tip: '已完成' };
    case 'migrated': return { ch: '>', cls: 'migrated', tip: '已轉移' };
    case 'scheduled': return { ch: '<', cls: 'scheduled', tip: '已排程' };
    case 'cancelled': return { ch: '•', cls: 'note', tip: '已捨棄' };
    default: return { ch: '•', cls: 'task', tip: '任務（點擊完成）' };
  }
}

/* ---------- 資料操作 ---------- */
function addEntry(type, text, loc) {
  text = text.trim();
  if (!text) return null;
  const e = { id: uid(), type, status: type === 'task' ? 'open' : null, text, loc, created: todayStr() };
  state.entries.push(e);
  save();
  return e;
}
function findEntry(id) { return state.entries.find(e => e.id === id); }
function entriesAt(loc) {
  return state.entries.filter(e => {
    if (e.loc.view !== loc.view) return false;
    if (loc.view === 'daily') return e.loc.date === loc.date;
    if (loc.view === 'monthly' || loc.view === 'future') return e.loc.month === loc.month;
    if (loc.view === 'collection') return e.loc.id === loc.id;
    return false;
  });
}
function locLabel(loc) {
  if (loc.view === 'daily') return `日誌 ${loc.date}`;
  if (loc.view === 'monthly') return `月誌 ${fmtMonth(loc.month)}`;
  if (loc.view === 'future') return `未來誌 ${fmtMonth(loc.month)}`;
  if (loc.view === 'collection') {
    const c = state.collections.find(c => c.id === loc.id);
    return `群組「${c ? c.name : '?'}」`;
  }
  return '';
}

/* 轉移：原任務標記，並在目標位置建立新任務 */
function migrateEntry(id, targetLoc, mark) {
  const e = findEntry(id);
  if (!e) return;
  e.status = mark; // 'migrated' or 'scheduled'
  state.entries.push({ id: uid(), type: 'task', status: 'open', text: e.text, loc: targetLoc, created: todayStr() });
  save();
  render();
  toast(mark === 'migrated' ? `已轉移到 ${locLabel(targetLoc)}` : `已排程到 ${locLabel(targetLoc)}`);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 共用：項目列表 ---------- */
function renderEntryList(entries, opts = {}) {
  if (!entries.length) return `<div class="empty">${opts.emptyMsg || '（尚無紀錄）'}</div>`;
  return `<ul class="entries">` + entries.map(e => {
    const s = symbolOf(e);
    const tcls = e.status && e.status !== 'open' ? e.status : '';
    const acts = [];
    if (e.type === 'task' && e.status === 'open') {
      acts.push(`<button onclick="doComplete('${e.id}')" title="完成">✕ 完成</button>`);
      if (e.loc.view === 'daily')
        acts.push(`<button onclick="doMigrateTomorrow('${e.id}')" title="轉移到隔天">&gt; 明天</button>`);
      acts.push(`<button onclick="openMigrateDlg('${e.id}')" title="轉移到指定日期的日誌、指定月份的月誌，或排程到未來誌">&gt; 轉移…</button>`);
      acts.push(`<button onclick="doCancel('${e.id}')" title="不再重要，畫刪除線捨棄">～ 捨棄</button>`);
    }
    if (e.type === 'task' && (e.status === 'done' || e.status === 'cancelled')) {
      acts.push(`<button onclick="doReopen('${e.id}')">還原</button>`);
    }
    acts.push(`<button onclick="doEdit('${e.id}')">✎</button>`);
    acts.push(`<button onclick="doDelete('${e.id}')" title="從筆記本永久移除">🗑</button>`);
    const locTag = opts.showLoc ? `<span class="eloc">${esc(locLabel(e.loc))}</span>` : '';
    const symClick = (e.type === 'task' && e.status === 'open') ? `onclick="doComplete('${e.id}')"` : '';
    return `<li>
      ${selCellHtml(e)}
      <span class="sym ${s.cls}" title="${s.tip}" ${symClick}>${s.ch}</span>
      <span class="etext ${tcls}" id="etext-${e.id}">${esc(e.text)}</span>
      ${locTag}
      <span class="eacts">${acts.join('')}</span>
    </li>`;
  }).join('') + `</ul>`;
}

/* ---------- 項目動作 ---------- */
function doComplete(id) { const e = findEntry(id); if (e) { e.status = 'done'; save(); render(); } }
function doReopen(id)   { const e = findEntry(id); if (e) { e.status = 'open'; save(); render(); } }
function doCancel(id)   { const e = findEntry(id); if (e) { e.status = 'cancelled'; save(); render(); toast('已捨棄（刪除線）'); } }
function doDelete(id) {

}
function doEdit(id) {

/* ---------- 轉移到指定位置（日誌／月誌／未來誌），支援多筆 ---------- */
let migrateDlgIds = [];
function pickMigTarget(v) {
  const r = document.querySelector(`input[name="migTarget"][value="${v}"]`);
  if (r) r.checked = true;
}
function setMigDate(d) {
  document.getElementById('mig-date').value = d;
  pickMigTarget('daily');
}
function nextMonday() {
  const [y, m, d] = todayStr().split('-').map(Number);
  const dow = new Date(y, m - 1, d).getDay(); // 0=日 … 6=六
  return addDays(todayStr(), ((8 - dow) % 7) || 7);
}
function openMigrateDlg(id) { openMigrateDlgFor([id]); }
function openMigrateDlgFor(ids) {
  ids = ids.filter(id => {
    const e = findEntry(id);
    return e && e.type === 'task' && e.status === 'open';
  });
  if (!ids.length) { toast('沒有可轉移的任務'); return; }
  migrateDlgIds = ids;
  let preview;
  if (ids.length === 1) preview = '• ' + findEntry(ids[0]).text;
  else {
    const names = ids.map(i => findEntry(i).text).join('、');
    preview = `共 ${ids.length} 個任務：` + (names.length > 60 ? names.slice(0, 60) + '…' : names);
  }
  document.getElementById('mig-text').textContent = preview;
  const first = findEntry(ids[0]);
  const baseDate = (ids.length === 1 && first.loc.view === 'daily') ? first.loc.date : todayStr();
  let defDate = addDays(baseDate, 1);
  if (defDate < todayStr()) defDate = todayStr(); // 過期任務不預設到過去的日期
  document.getElementById('mig-date').value = defDate;
  document.getElementById('mig-month').value =
    (ids.length === 1 && first.loc.view === 'monthly') ? addMonths(first.loc.month, 1) : thisMonth();
  const sel = document.getElementById('mig-future');
  sel.innerHTML = '';
  for (let i = 1; i <= 12; i++) {
    const m = addMonths(thisMonth(), i);
    sel.innerHTML += `<option value="${m}">${fmtMonth(m)}</option>`;
  }
  pickMigTarget('daily');
  document.getElementById('migrateDlg').showModal();
}
function sameLoc(a, b) {
  return a.view === b.view && a.date === b.date && a.month === b.month && a.id === b.id;
}
function confirmMigrate() {
  const t = document.querySelector('input[name="migTarget"]:checked').value;
  let loc, mark = 'migrated';
  if (t === 'daily') {
    const d = document.getElementById('mig-date').value;
    if (!d) { alert('請先選擇要轉移到哪一天。'); return; }
    loc = { view: 'daily', date: d };
  } else if (t === 'monthly') {
    const m = document.getElementById('mig-month').value;
    if (!m) { alert('請先選擇要轉移到哪個月份。'); return; }
    loc = { view: 'monthly', month: m };
  } else {
    loc = { view: 'future', month: document.getElementById('mig-future').value };
    mark = 'scheduled';
  }
  let moved = 0, skipped = 0;
  migrateDlgIds.forEach(id => {
    const e = findEntry(id);
    if (!e || e.status !== 'open' || sameLoc(loc, e.loc)) { skipped++; return; }
    e.status = mark;
    state.entries.push({ id: uid(), type: 'task', status: 'open', text: e.text, loc: { ...loc }, created: todayStr() });
    moved++;
  });
  if (!moved) {
    alert(migrateDlgIds.length === 1
      ? '目標位置和任務目前的位置相同，請選別的位置。'
      : '勾選的任務都已經在目標位置了。');
    return;
  }
  document.getElementById('migrateDlg').close();
  migrateDlgIds = [];
  selIds.clear();
  save(); render();
  toast(`已轉移 ${moved} 個任務到 ${locLabel(loc)}` + (skipped ? `（${skipped} 個原本就在該位置，略過）` : ''));
}

/* 這一天之前累積、還沒完成的任務（含過去的日誌／過期的月誌與未來誌） */
function overdueTasks(dateStr) {
  const month = dateStr.slice(0, 7);
  const key = e => e.loc.view === 'daily' ? e.loc.date : e.loc.month + '-99';
  return state.entries.filter(e =>
    e.type === 'task' && e.status === 'open' && (
      (e.loc.view === 'daily' && e.loc.date < dateStr) ||
      ((e.loc.view === 'monthly' || e.loc.view === 'future') && e.loc.month < month)
    )).sort((a, b) => key(a) < key(b) ? -1 : 1);
}

/* ---------- SVG 圖表 ---------- */
function chartWrap(title, inner) {
  return `<div style="margin-top:20px"><h2 style="font-size:.92rem;margin-bottom:8px">${title}</h2>${inner}</div>`;
}
/* 折線圖：labels 對應 vals（null 表示該點無資料，線段會斷開） */
function svgLine(labels, vals, opts = {}) {
  const nums = vals.filter(v => v != null);
  if (!nums.length) return `<div class="empty">尚無數值資料</div>`;
  const W = 720, H = 200, padL = 46, padR = 12, padT = 14, padB = 26;
  const color = opts.color || '#b3541e';
  let min = Math.min(...nums), max = Math.max(...nums);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.1; max += span * 0.1;
  const x = i => padL + (W - padL - padR) * (labels.length === 1 ? 0.5 : i / (labels.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  let grid = '';
  for (let t = 0; t <= 4; t++) {
    const v = min + (max - min) * t / 4, yy = y(v);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="#eee5d6"/>
      <text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#6b6357">${fmtNum(v)}</text>`;
  }
  const stepL = Math.ceil(labels.length / 16);
  let xlab = '';
  labels.forEach((l, i) => {
    if (i % stepL === 0 || i === labels.length - 1)
      xlab += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#6b6357">${l}</text>`;
  });
  let d = '', prev = false, dots = '';
  vals.forEach((v, i) => {
    if (v == null) { prev = false; return; }
    d += (prev ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
    prev = true;
    dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${color}">
      <title>${labels[i]}：${v}${opts.unit ? ' ' + opts.unit : ''}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fffdf9;border:1px solid var(--line);border-radius:8px">
    ${grid}${xlab}<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
}
/* 堆疊長條圖：series = [{name, color, values}] */
function svgBars(labels, series) {
  const W = 720, H = 210, padL = 38, padR = 10, padT = 12, padB = 26;
  const sums = labels.map((_, i) => series.reduce((a, s) => a + (Number(s.values[i]) || 0), 0));
  let max = Math.max(...sums, 1);
  const step = Math.max(1, Math.ceil(max / 4));
  max = step * Math.ceil(max / step);
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const y = v => padT + innerH * (1 - v / max);
  const slot = innerW / labels.length;
  const bw = Math.min(26, slot * 0.7);
  let grid = '';
  for (let v = 0; v <= max; v += step) {
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="#eee5d6"/>
      <text x="${padL - 5}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#6b6357">${v}</text>`;
  }
  let bars = '';
  labels.forEach((l, i) => {
    let acc = 0;
    const bx = padL + slot * i + (slot - bw) / 2;
    series.forEach(s => {
      const v = Number(s.values[i]) || 0;
      if (!v) return;
      const y1 = y(acc + v), h = y(acc) - y1;
      bars += `<rect x="${bx.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${s.color}" rx="1">
        <title>${l}　${s.name}：${v}</title></rect>`;
      acc += v;
    });
  });
  const stepL = Math.ceil(labels.length / 16);
  let xlab = '';
  labels.forEach((l, i) => {
    if (i % stepL === 0 || i === labels.length - 1)
      xlab += `<text x="${(padL + slot * i + slot / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#6b6357">${l}</text>`;
  });
  const legend = series.length > 1 ? `<div class="legend" style="margin:0 0 6px">${series.map(s =>
    `<span><i style="display:inline-block;width:10px;height:10px;background:${s.color};border-radius:2px;margin-right:4px"></i>${s.name}</span>`).join('')}</div>` : '';
  return legend + `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fffdf9;border:1px solid var(--line);border-radius:8px">${grid}${bars}${xlab}</svg>`;
}

/* ---------- 統計 ---------- */
function entriesForMonth(m) {
  return state.entries.filter(e =>
    (e.loc.view === 'daily' && e.loc.date.startsWith(m)) ||
    (e.loc.view === 'monthly' && e.loc.month === m));
}
function tally(list) {
  const t = { task: 0, done: 0, open: 0, migrated: 0, scheduled: 0, cancelled: 0, event: 0, note: 0, total: list.length };
  list.forEach(e => {
    if (e.type === 'event') t.event++;
    else if (e.type === 'note') t.note++;
    else { t.task++; t[e.status]++; }
  });
  const denom = t.task - t.cancelled;
  t.rate = denom > 0 ? Math.round(t.done / denom * 100) + '%' : '—';
  return t;
}

function statsMonth() {
  const t = tally(entriesForMonth(curMonth));
  const cards = [
    ['• 任務總數', t.task], ['✕ 已完成', t.done], ['• 未完成', t.open],
    ['&gt; 已轉移', t.migrated], ['&lt; 已排程', t.scheduled], ['～ 已捨棄', t.cancelled],
    ['完成率', t.rate], ['○ 事件', t.event], ['– 筆記', t.note],
  ].map(([l, v]) => `<div class="stat-card"><div class="num">${v}</div><div class="lbl">${l}</div></div>`).join('');
  // 每日紀錄量堆疊長條圖（依日誌日期）
  const nDays = daysInMonth(curMonth);
  const labels = [];
  const data = { done: [], other: [], event: [], note: [] };
  for (let d = 1; d <= nDays; d++) {
    const ds = `${curMonth}-${pad(d)}`;
    labels.push(String(d));
    const dl = state.entries.filter(e => e.loc.view === 'daily' && e.loc.date === ds);
    data.done.push(dl.filter(e => e.type === 'task' && e.status === 'done').length);
    data.other.push(dl.filter(e => e.type === 'task' && e.status !== 'done').length);
    data.event.push(dl.filter(e => e.type === 'event').length);
    data.note.push(dl.filter(e => e.type === 'note').length);
  }
  const hasDaily = Object.values(data).some(a => a.some(v => v > 0));
  const chart = hasDaily
    ? chartWrap(`📊 每日紀錄量 — ${fmtMonth(curMonth)}（依日誌）`,
        svgBars(labels, STAT_SERIES.map(s => ({ name: s.name, color: s.color, values: data[s.key] }))))
    : '';
  return monthNavHtml() +
    (t.total ? '' : `<div class="empty" style="margin-bottom:10px">${fmtMonth(curMonth)} 沒有任何紀錄。</div>`) +
    `<div class="stat-cards">${cards}</div>
     <p style="font-size:.78rem;color:var(--ink-soft);margin-top:10px">完成率 ＝ 已完成 ÷（任務總數 － 已捨棄）</p>` + chart +
    statsTaskLists(entriesForMonth(curMonth));
}
function statsYear() {
  const yt = { task: 0, done: 0, open: 0, migrated: 0, scheduled: 0, cancelled: 0, event: 0, note: 0 };
  const labels = [];
  const data = { done: [], other: [], event: [], note: [] };
  const yearEntries = [];
  let rows = '';
  for (let m = 1; m <= 12; m++) {
    const ms = `${curYear}-${pad(m)}`;
    const monthEntries = entriesForMonth(ms);
    yearEntries.push(...monthEntries);
    const t = tally(monthEntries);
    Object.keys(yt).forEach(k => yt[k] += t[k]);
    labels.push(`${m}月`);
    data.done.push(t.done);
    data.other.push(t.task - t.done);
    data.event.push(t.event);
    data.note.push(t.note);
    rows += `<tr><td class="l">${m} 月</td><td>${t.task}</td><td>${t.done}</td><td>${t.open}</td>
      <td>${t.migrated + t.scheduled}</td><td>${t.cancelled}</td><td>${t.rate}</td><td>${t.event}</td><td>${t.note}</td></tr>`;
  }
  const denom = yt.task - yt.cancelled;
  const yrate = denom > 0 ? Math.round(yt.done / denom * 100) + '%' : '—';
  const hasAny = Object.values(data).some(a => a.some(v => v > 0));
  const chart = hasAny
    ? chartWrap(`📊 每月紀錄量 — ${curYear} 年`,
        svgBars(labels, STAT_SERIES.map(s => ({ name: s.name, color: s.color, values: data[s.key] }))))
    : '';
  return yearNavHtml() + `<div style="overflow-x:auto"><table class="stat-table">
    <tr><th>月份</th><th>任務</th><th>完成</th><th>未完成</th><th>轉移/排程</th><th>捨棄</th><th>完成率</th><th>事件</th><th>筆記</th></tr>
    ${rows}
    <tr class="total"><td class="l">全年合計</td><td>${yt.task}</td><td>${yt.done}</td><td>${yt.open}</td>
      <td>${yt.migrated + yt.scheduled}</td><td>${yt.cancelled}</td><td>${yrate}</td><td>${yt.event}</td><td>${yt.note}</td></tr>
  </table></div>` + chart + statsTaskLists(yearEntries);
}

/* 索引 */
function renderIndex() {
  const months = {};
  state.entries.forEach(e => {
    let m = null;
    if (e.loc.view === 'daily') m = e.loc.date.slice(0, 7);
    if (e.loc.view === 'monthly') m = e.loc.month;
    if (m) months[m] = (months[m] || 0) + 1;
  });
  const monthRows = Object.keys(months).sort().reverse().map(m =>
    `<li><a onclick="curMonth='${m}';view='monthly';render()">📅 ${fmtMonth(m)}</a>
     <span class="cnt">${months[m]} 筆紀錄</span></li>`).join('');
  const futureCnt = state.entries.filter(e => e.loc.view === 'future').length;
  const colRows = state.collections.map(c =>
    `<li><a onclick="curCollection='${c.id}';view='collections';render()">📄 ${esc(c.name)}</a></li>`).join('');
  $main.innerHTML = `
  <div class="card" style="background:var(--accent-soft);border:none">
    <b>索引（Index）</b>：筆記本的專屬目錄。紙本需要手動登記頁碼，這裡替你自動整理好了——點擊即可跳轉。
  </div>
  <div class="two-col">
    <div class="card">
      <h2>📖 月份紀錄</h2>
      ${monthRows ? `<ul class="index-list">${monthRows}</ul>` : '<div class="empty">尚無紀錄</div>'}
      <ul class="index-list"><li><a onclick="view='future';render()">🔭 未來誌</a><span class="cnt">${futureCnt} 筆</span></li></ul>
    </div>
    <div class="card">
      <h2>🗂 群組與追蹤</h2>
      ${colRows ? `<ul class="index-list">${colRows}</ul>` : '<div class="empty">尚無群組</div>'}
      <ul class="index-list">
        <li><a onclick="view='habits';render()">🔲 習慣追蹤</a><span class="cnt">${state.habits.length} 個項目</span></li>
        <li><a onclick="view='stats';render()">📊 紀錄統計</a></li>
      </ul>
    </div>
  </div>`;
}

/* 月末轉移 */
function migrationCandidates() {
  const today = todayStr(), month = thisMonth();
  return state.entries.filter(e =>
    e.type === 'task' && e.status === 'open' && (
      (e.loc.view === 'daily' && e.loc.date < today) ||
      (e.loc.view === 'monthly' && e.loc.month <= month) ||
      (e.loc.view === 'future' && e.loc.month < month)
    ));
}
function renderMigrate() {
  const cands = migrationCandidates();
  const cards = cands.map(e => `
    <div class="mig-card">
      <div class="qtext"><span class="sym task">•</span> ${esc(e.text)}</div>
      <div class="qsrc">來源：${esc(locLabel(e.loc))}（建立於 ${e.created}）</div>
      <div class="qbtns">
        <button class="btn" onclick="doComplete('${e.id}')">✕ 其實做完了</button>
        <button class="btn" onclick="doMigrateNextMonth('${e.id}')">&gt; 轉移到下月</button>
        <button class="btn" onclick="openSchedule('${e.id}')">&lt; 排程到未來</button>
        <button class="btn" onclick="doCancel('${e.id}')">～ 不重要，捨棄</button>
      </div>
    </div>`).join('');
  $main.innerHTML = `
  <div class="card">
    <h2>🔄 月末轉移儀式（Migration）<span class="hint">子彈筆記最精華的篩選機制</span></h2>
    <div class="soul">
      面對每一個未完成的任務，先停下來問自己兩個問題：<br>
      <b>1. 這個任務現在真的重要嗎？</b><br>
      <b>2. 如果不做，會有什麼實質的負面影響嗎？</b><br>
      若同一個任務已經連續轉移了好幾個月，請考慮：捨棄它，或把它拆解成更小的步驟。
    </div>
    ${cands.length
      ? `<p style="font-size:.88rem;color:var(--ink-soft);margin-bottom:12px">找到 <b>${cands.length}</b> 個未完成的任務需要盤點：</p>${cards}`
      : `<div class="empty">🎉 太棒了！目前沒有需要盤點的過期任務。</div>`}
  </div>`;
}

/* ---------- 匯出／匯入 ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bullet_journal_backup_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已下載備份檔');
}
function importData(input) {
  const f = input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.entries) || !Array.isArray(data.collections)) throw new Error('格式不符');
      if (!confirm('匯入將覆蓋目前所有筆記資料，確定繼續？')) return;
      state = normalize(data);
      save(); render();
      toast('匯入完成');
    } catch (err) { alert('匯入失敗：' + err.message); }
  };
  r.readAsText(f);
  input.value = '';
}

render();
initSync();
</script>
